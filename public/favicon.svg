<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 米纸底 -->
  <rect width="64" height="64" rx="14" fill="#FAEFD9"/>
  <!-- 圆角卡frame -->
  <rect x="3" y="3" width="58" height="58" rx="12" fill="none" stroke="#161513" stroke-width="4.5"/>
  <!-- 打开的书（两页） -->
  <path d="M14 22 c5 -3 10 -3 15 0 c5 -3 10 -3 15 0 v20 c-5 -3 -10 -3 -15 0 c-5 -3 -10 -3 -15 0 z" fill="#FFFBF6" stroke="#161513" stroke-width="3"/>
  <path d="M32 22 v20" stroke="#161513" stroke-width="2.5"/>
  <!-- 音标 /ˈleksi/ -->
  <text x="32" y="37" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#161513" text-anchor="middle">/ˈleksi/</text>
  <!-- 左上绿色闪光（AI星点） -->
  <path d="M20 9 c0 3.6 2.4 6 6 6 c-3.6 0 -6 2.4 -6 6 c0 -3.6 -2.4 -6 -6 6 c0 -3.6 2.4 -6 6 -6 z" fill="#2F6F5E" transform="translate(0,-3) scale(0.55) translate(-18,-14)"/>
  <!-- 右下侧绿点尾 -->
  <circle cx="49" cy="42" r="3" fill="#2F6F5E"/>
  <!-- 左下 AI 墨块 -->
  <path d="M8 40 h18 a6 6 0 0 1 6 6 a6 6 0 0 1 -6 6 h-18 z" fill="#161513"/>
  <text x="15" y="49" font-family="Arial, Helvetica, sans-serif" font-size="8" font-weight="800" fill="#2F6F5E">AI</text>
</svg>
